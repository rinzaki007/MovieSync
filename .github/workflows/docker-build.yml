# MovieSync GitHub Actions
# PR 自动执行测试与 Docker 构建；正式镜像仅通过手动触发发布。
name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一 PR/ref 只保留最新检查；不同 PR 的检查互不影响。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, lint and validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: |
          node --check static/js/main.js
          node --check static/js/resource-select.js
          node --check static/js/task-center.js

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q --cov=moviesync --cov-report=term-missing

      - name: Run Ruff
        run: ruff check . --output-format=github

  build-pr:
    name: Build Docker image (PR validation)
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: moviesync-openlist-smoke:pr

      - name: Smoke-test bundled OpenList and MovieSync
        run: |
          set -eu
          docker run -d --name moviesync-openlist-smoke \
            -p 127.0.0.1:18090:5000 \
            -p 127.0.0.1:18245:5244 \
            moviesync-openlist-smoke:pr

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs moviesync-openlist-smoke || true
            fi
            docker rm -f moviesync-openlist-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18245/ping >/dev/null; then
              echo "Bundled OpenList is healthy"
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "Bundled OpenList did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18090/healthz >/dev/null; then
              echo "MovieSync is healthy"
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "MovieSync did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

  publish:
    name: Publish Docker image (manual only)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/moviesync:latest
