<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于与数据来源 - MovieSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body class="min-h-screen bg-slate-950 text-slate-200">
    <header class="border-b border-slate-800 bg-slate-900/80 px-4 py-4">
        <div class="mx-auto flex max-w-4xl items-center justify-between gap-4">
            <h1 class="text-lg font-semibold text-white">MovieSync · 关于与数据来源</h1>
            <a href="/" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:bg-slate-800">返回首页</a>
        </div>
    </header>
    <main class="mx-auto max-w-4xl space-y-5 px-4 py-8">
        <section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5 sm:p-6">
            <h2 class="text-base font-semibold text-white">影视信息来源</h2>
            <p class="mt-2 text-sm leading-6 text-slate-400">MovieSync 可以通过不同的卡片获取影视信息。管理员可以在「卡片管理」中分别启用、停用或设置每个来源；系统默认不会把多个来源的结果混在一起。</p>
        </section>

        

        <section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5 sm:p-6">
            <h2 class="text-base font-semibold text-white">豆瓣</h2>
            <p class="mt-2 text-sm leading-6 text-slate-400">豆瓣信息来自豆瓣的公开页面或接口。MovieSync 与豆瓣没有官方关联，请遵守豆瓣的服务条款和内容使用规则。</p>
            <a href="https://movie.douban.com/" target="_blank" rel="noopener noreferrer" class="mt-2 inline-block text-xs text-sky-400 hover:text-sky-300">访问豆瓣电影</a>
        </section>

        <p class="px-1 text-xs leading-5 text-slate-600">MovieSync 运行在你自己的设备或服务器上。各来源是否可用、信息是否完整以及内容是否准确，由对应服务决定。</p>
    </main>
</body>
</html>
