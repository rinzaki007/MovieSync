<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>播放中心 - MovieSync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
  <style>
    .playback-shell{background:linear-gradient(145deg,rgba(15,23,42,.94),rgba(2,6,23,.84));border:1px solid rgba(148,163,184,.14);box-shadow:0 18px 48px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.025)}
    /* Keep controls and guidance scoped to their owning playback source. */
    #playback-main-grid:not(.playback-online-layout) #vod_source_manager-episode-panel{display:none!important}
    #playback-main-grid:not(.playback-online-layout) #vod_source_manager-inline-panel{display:none!important}
    #playback-main-grid.playback-online-layout #playback-openlist-hint{display:none!important}
    /* Both sources use the same resource-left, video-right workspace proportions. */
    #playback-main-grid.playback-online-layout{grid-template-columns:minmax(250px,.65fr) minmax(0,1.8fr)!important;align-items:start}
    #playback-main-grid.playback-online-layout #vod_source_manager-inline-panel{grid-column:1;grid-row:1;margin-top:0;min-width:0}
    #playback-main-grid.playback-online-layout #player-workspace-panel{grid-column:2;grid-row:1;min-width:0}
    #vod_source_manager-inline-panel.vod_source_manager-inline-layout>section{max-height:calc(100vh - 150px);overflow:auto}
    #vod_source_manager-inline-panel.vod_source_manager-inline-layout .grid{display:flex;flex-direction:column;gap:.75rem}
    #vod_source_manager-inline-panel.vod_source_manager-inline-layout .grid>aside{order:-1}
    #vod_source_manager-inline-panel.vod_source_manager-inline-layout #vod_source_manager-watch-results{max-height:38vh;overflow-y:auto;padding-right:2px}
    @media(max-width:1023px){
      #playback-main-grid.playback-online-layout{grid-template-columns:minmax(0,1fr)!important}
      #playback-main-grid.playback-online-layout #vod_source_manager-inline-panel{grid-column:1;grid-row:1}
      #playback-main-grid.playback-online-layout #player-workspace-panel{grid-column:1;grid-row:2}
      #vod_source_manager-inline-panel.vod_source_manager-inline-layout>section{max-height:none}
      #vod_source_manager-inline-panel.vod_source_manager-inline-layout #vod_source_manager-watch-results{max-height:none}
    }
    .playback-control{background:rgba(2,6,23,.62);border:1px solid rgba(71,85,105,.55)}
    .media-row{border:1px solid transparent;transition:background .15s ease,border-color .15s ease}
    .media-row:hover{background:rgba(51,65,85,.35);border-color:rgba(148,163,184,.16)}
    .media-row.selected{background:rgba(16,185,129,.09);border-color:rgba(52,211,153,.3)}
    #video-player{background:#000;max-height:78vh}
    /* Plyr: MovieSync dark cinema theme */
    :root{--plyr-color-main:#34d399;--plyr-video-background:#000;--plyr-menu-background:rgba(8,13,24,.97);--plyr-menu-color:#e2e8f0;--plyr-tooltip-background:#0f172a;--plyr-tooltip-color:#f8fafc}
    .playback-player{overflow:hidden;border:1px solid rgba(148,163,184,.16);border-radius:14px;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.35)}
    .playback-player .plyr{--plyr-control-radius:8px;width:100%}
    .playback-player .plyr__video-wrapper{background:#000}
    .playback-player .plyr__controls{padding:12px 14px;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.78) 45%,rgba(0,0,0,.94) 100%)}
    .playback-player .plyr__control:hover,.playback-player .plyr__control[aria-expanded="true"]{background:rgba(52,211,153,.16)}
    .playback-player .plyr__menu__container{border:1px solid rgba(148,163,184,.18);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
    @media(max-width:767px){ #video-player{max-height:42vh}.playback-main{padding:.75rem}.playback-shell{border-radius:1rem}.playback-header{align-items:flex-start}.playback-header-actions{flex-wrap:wrap;justify-content:flex-end}.playback-player{border-radius:10px}.playback-player .plyr__controls{padding:8px}}
    /* Fullscreen must escape the 16:9 ratio box used during normal playback. */
    .playback-player .plyr.plyr--fullscreen-active,
    .playback-player .plyr:fullscreen,
    .playback-player .plyr:-webkit-full-screen{
      width:100vw !important;
      height:100vh !important;
      max-width:none !important;
      max-height:none !important;
      margin:0 !important;
      padding:0 !important;
      border:0 !important;
      border-radius:0 !important;
      overflow:hidden !important;
      background:#000 !important;
    }
    .playback-player .plyr.plyr--fullscreen-active .plyr__video-wrapper,
    .playback-player .plyr:fullscreen .plyr__video-wrapper,
    .playback-player .plyr:-webkit-full-screen .plyr__video-wrapper{
      position:absolute !important;
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      max-height:none !important;
      padding:0 !important;
      margin:0 !important;
      background:#000 !important;
    }
    .playback-player .plyr.plyr--fullscreen-active video#video-player,
    .playback-player .plyr:fullscreen video#video-player,
    .playback-player .plyr:-webkit-full-screen video#video-player{
      position:absolute !important;
      inset:0 !important;
      display:block !important;
      width:100% !important;
      height:100% !important;
      max-width:none !important;
      max-height:none !important;
      object-fit:contain !important;
    }
    .playback-player .plyr.plyr--fullscreen-active .plyr__controls,
    .playback-player .plyr:fullscreen .plyr__controls,
    .playback-player .plyr:-webkit-full-screen .plyr__controls{
      position:absolute;
      z-index:5;
      right:0;
      bottom:0;
      left:0;
    }
    /* Plyr's CSS fallback fullscreen mode. */
    .playback-player.plyr--fullscreen-fallback,
    .playback-player.plyr--fullscreen-fallback .plyr{
      position:fixed !important;
      inset:0 !important;
      width:100vw !important;
      height:100vh !important;
      max-width:none !important;
      max-height:none !important;
      margin:0 !important;
      padding:0 !important;
      border:0 !important;
      border-radius:0 !important;
      z-index:2147483647 !important;
      background:#000 !important;
    }
    .playback-player.plyr--fullscreen-fallback .plyr__video-wrapper{
      position:absolute !important;
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      max-height:none !important;
      padding:0 !important;
      margin:0 !important;
      background:#000 !important;
    }
    .playback-player.plyr--fullscreen-fallback video#video-player{
      position:absolute !important;
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      max-width:none !important;
      max-height:none !important;
      object-fit:contain !important;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100">
  <header class="playback-header sticky top-0 z-30 border-b border-slate-800/80 bg-slate-950/90 px-3 py-3 backdrop-blur-xl sm:px-5">
    <div class="mx-auto flex max-w-screen-2xl items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-3">
        <a href="/" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-slate-700 bg-slate-900/70 text-slate-300 transition hover:bg-slate-800" aria-label="返回首页"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="min-w-0">
          <div class="flex items-center gap-2"><span class="flex h-7 w-7 items-center justify-center rounded-lg bg-emerald-500/15 text-emerald-300"><i class="fa-solid fa-circle-play"></i></span><h1 class="text-base font-bold tracking-wide">播放中心</h1></div>
          <p class="mt-1 text-xs text-slate-400"><span data-source-description="files">浏览已转存的视频，直接在 MovieSync 内播放</span><span data-source-description="online" class="hidden">搜索资源站，播放电影、电视剧、动漫和综艺</span></p>
        </div>
      </div>
      <div class="playback-header-actions flex shrink-0 items-center gap-2">
        <span id="provider-badge" class="hidden rounded-full border border-slate-700 bg-slate-900 px-2.5 py-1.5 text-[10px] text-slate-400 sm:inline-flex sm:items-center sm:gap-1.5"><i class="fa-solid fa-circle text-[7px] text-slate-500"></i>正在检测播放卡片</span>
        <a href="/tasks" class="rounded-xl border border-slate-700 bg-slate-900/70 px-3 py-2 text-xs text-slate-300 transition hover:bg-slate-800"><i class="fa-solid fa-list-check mr-1"></i>任务中心</a>
        <a href="/admin" class="rounded-xl border border-slate-700 bg-slate-900/70 px-3 py-2 text-xs text-slate-300 transition hover:bg-slate-800"><i class="fa-solid fa-sliders mr-1"></i>卡片设置</a>
      </div>
    </div>
  </header>
  <div id="playback-source-switch" class="mx-auto flex w-full max-w-screen-2xl items-center gap-2 px-3 pt-4 sm:px-5" role="tablist" aria-label="播放来源">
    <button type="button" data-playback-source="files" role="tab" aria-selected="true" class="rounded-xl border border-emerald-600/60 bg-emerald-950/50 px-4 py-2.5 text-xs font-semibold text-emerald-200 transition hover:bg-emerald-900/50"><i class="fa-solid fa-folder-open mr-2"></i>媒体文件</button>
    <button type="button" data-playback-source="online" role="tab" aria-selected="false" class="rounded-xl border border-slate-700 bg-slate-900/50 px-4 py-2.5 text-xs font-semibold text-slate-300 transition hover:border-slate-600 hover:bg-slate-800"><i class="fa-solid fa-globe mr-2"></i>在线点播</button>
    <span class="ml-auto hidden text-[10px] text-slate-500 sm:inline">切换来源时显示对应控件</span>
  </div>
  <main id="playback-main-grid" class="playback-main mx-auto grid w-full max-w-screen-2xl gap-4 p-3 sm:p-5 lg:grid-cols-[minmax(250px,.65fr)_minmax(0,1.8fr)]">
    <section id="file-browser-panel" class="playback-shell flex min-w-0 flex-col overflow-hidden rounded-2xl">
      <div class="border-b border-slate-800/80 p-4">
        <div class="flex items-start justify-between gap-3">
          <div><h2 class="text-sm font-semibold text-white"><i class="fa-solid fa-folder-open mr-2 text-amber-300"></i>媒体文件</h2><p id="path-label" class="mt-1.5 break-all text-[11px] leading-5 text-slate-500">正在读取目录…</p></div>
          <button id="back-btn" class="shrink-0 rounded-lg border border-slate-700 px-3 py-2 text-[11px] text-slate-300 transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40" disabled><i class="fa-solid fa-arrow-up mr-1"></i>上一级</button>
        </div>
        <div class="mt-3 flex gap-2">
          <label class="playback-control flex min-w-0 flex-1 items-center gap-2 rounded-xl px-3"><i class="fa-solid fa-magnifying-glass text-xs text-slate-500"></i><input id="file-search" type="search" placeholder="筛选当前目录…" class="w-full min-w-0 bg-transparent py-2.5 text-xs text-slate-200 outline-none placeholder:text-slate-600"></label>
          <button id="refresh-btn" class="flex shrink-0 items-center gap-2 rounded-xl border border-slate-700 px-3 py-2 text-xs text-slate-300 transition hover:bg-slate-800" title="重新读取当前目录（忽略缓存）" aria-label="刷新当前目录"><i class="fa-solid fa-rotate"></i><span>刷新目录</span></button>
        </div>
      </div>
      <div class="flex items-center justify-between gap-2 px-4 pt-3"><span id="status" class="text-[11px] text-slate-400">正在连接播放卡片…</span><span id="file-count" class="shrink-0 text-[10px] text-slate-600"></span></div>
      <div id="file-list" class="min-h-48 flex-1 space-y-1 overflow-y-auto p-2 sm:p-3"></div>
      <div class="border-t border-slate-800/70 px-4 py-3 text-[10px] leading-5 text-slate-500"><i class="fa-solid fa-circle-info mr-1 text-slate-600"></i>仅显示当前目录内容；视频文件可点击播放，文件夹可继续浏览。</div>
    </section>
    <section id="player-workspace-panel" class="playback-shell min-w-0 overflow-hidden rounded-2xl">
      <div class="flex items-start justify-between gap-3 border-b border-slate-800/80 p-4">
        <div class="min-w-0"><div class="text-[10px] font-semibold uppercase tracking-[.18em] text-emerald-400">Now Playing</div><h2 id="player-title" class="mt-1.5 break-words text-sm font-semibold text-white">选择一个视频开始播放</h2><p id="player-path" class="mt-1 break-all text-[10px] leading-5 text-slate-500">尚未选择文件</p></div>
        <span id="player-state" class="shrink-0 rounded-full border border-slate-700 bg-slate-950/70 px-2.5 py-1.5 text-[10px] text-slate-500"><i class="fa-solid fa-circle mr-1 text-[7px]"></i>待播放</span>
      </div>
      <div class="p-3 sm:p-4">
        <div class="playback-player">
          <video id="video-player" playsinline controls preload="metadata"></video>
        </div>
        <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
          <div id="player-status" class="flex-1 text-xs leading-5 text-slate-400">播放地址由播放卡片解析，视频流由浏览器直接请求。</div>
          <button id="stop-btn" class="rounded-lg border border-slate-700 px-3 py-2 text-[11px] text-slate-400 transition hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-stop mr-1"></i>停止播放</button>
        </div>
        <div id="vod_source_manager-episode-panel" class="hidden mt-4 min-w-0 rounded-xl border border-slate-800/80 bg-slate-950/40 p-3 sm:p-4"></div>
        <div id="playback-openlist-hint" class="mt-4 rounded-xl border border-slate-800/70 bg-slate-950/35 p-3 text-[11px] leading-5 text-slate-500"><i class="fa-solid fa-lightbulb mr-1.5 text-amber-300"></i>如果无法播放或拖动进度条，请确认浏览器能访问 OpenList 返回的播放链接；部分编码格式也可能不受浏览器支持。</div>
        <div id="vod_source_manager-inline-panel" class="hidden mt-4 min-w-0"></div>
      </div>
    </section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
<script src="{{ url_for('static', filename='js/vod-source-manager-playback.js') }}"></script>
<script>
(() => {
  const list = document.getElementById('file-list');
  const status = document.getElementById('status');
  const pathLabel = document.getElementById('path-label');
  const backButton = document.getElementById('back-btn');
  const refreshButton = document.getElementById('refresh-btn');
  const searchInput = document.getElementById('file-search');
  const fileCount = document.getElementById('file-count');
  const player = document.getElementById('video-player');
  const plyrPlayer = new Plyr(player, {
    ratio: '16:9',
    hideControls: true,
    controls: [
      'play-large', 'play', 'progress', 'current-time', 'duration',
      'mute', 'volume', 'captions', 'settings', 'fullscreen'
    ],
    settings: ['captions', 'speed'],
    speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
    captions: { active: false, language: 'zh', update: true },
    keyboard: { focused: true, global: false },
    tooltips: { controls: true, seek: true },
    i18n: {
      restart: '重新播放', play: '播放', pause: '暂停',
      speed: '播放速度', normal: '正常', settings: '播放设置',
      captions: '字幕', enableCaptions: '开启字幕',
      disableCaptions: '关闭字幕', enterFullscreen: '进入全屏',
      exitFullscreen: '退出全屏'
    }
  });

  // Keep the shared Plyr player and online source panel as sibling grid columns.
  const playbackGrid = document.getElementById('playback-main-grid');
  const playerWorkspace = document.getElementById('player-workspace-panel');
  const inlinePlaybackPanel = document.getElementById('vod_source_manager-inline-panel');
  if (playbackGrid && playerWorkspace && inlinePlaybackPanel && inlinePlaybackPanel.parentElement !== playbackGrid) {
    playbackGrid.appendChild(inlinePlaybackPanel);
  }

  function clearSubtitleTracks() {
    player.querySelectorAll('track[data-moviesync-track]')
      .forEach(track => track.remove());
  }

  function stopOnlinePlayback() {
    // Invalidate pending async setup (including an in-flight HLS script load) before teardown.
    playbackTaskGeneration++;
    // Detach per-source handlers before pause/load so teardown cannot trigger fallback.
    player.onerror = null;
    player.onplaying = null;
    if (onlineHls) {
      onlineHls.destroy();
      onlineHls = null;
    }
    player.pause();
    player.removeAttribute('src');
    player.load();
  }

  async function ensureHls() {
    if (window.Hls) return;
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
      script.onload = resolve;
      script.onerror = () => reject(new Error('HLS 播放组件加载失败'));
      document.head.appendChild(script);
    });
  }

  function setPlayerState(label, tone = 'neutral') {
    playerState.textContent = label;
    const styles = {
      neutral: 'shrink-0 rounded-full border border-slate-700 bg-slate-950/70 px-2.5 py-1.5 text-[10px] text-slate-500',
      loading: 'shrink-0 rounded-full border border-amber-400/20 bg-amber-400/5 px-2.5 py-1.5 text-[10px] text-amber-300',
      playing: 'shrink-0 rounded-full border border-emerald-400/20 bg-emerald-400/5 px-2.5 py-1.5 text-[10px] text-emerald-300',
      error: 'shrink-0 rounded-full border border-rose-400/20 bg-rose-400/5 px-2.5 py-1.5 text-[10px] text-rose-300'
    };
    playerState.className = styles[tone] || styles.neutral;
  }

  async function playOnline(url, title, itemName) {
    let parsed;
    try { parsed = new URL(url, window.location.href); }
    catch { throw new Error('播放地址格式无效。'); }
    if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('只支持 HTTP 或 HTTPS 在线播放地址。');
    stopOnlinePlayback();
    const taskGeneration = playbackTaskGeneration;
    const isCurrentTask = () => taskGeneration === playbackTaskGeneration;
    let failureHandled = false;
    const handleFailure = (message) => {
      if (!isCurrentTask() || failureHandled) return;
      // A fatal HLS event and the media element error can describe the same failure.
      // Advance automatic fallback at most once for this playback attempt.
      failureHandled = true;
      playerStatus.textContent = '在线线路加载失败；正在尝试下一条资源。';
      setPlayerState('播放失败', 'error');
      if (window.MovieSyncPlayback && window.MovieSyncPlayback.onOnlinePlaybackFailure) {
        window.MovieSyncPlayback.onOnlinePlaybackFailure(new Error(message));
      }
    };
    clearSubtitleTracks();
    player.onerror = () => handleFailure('媒体资源加载失败');
    player.onplaying = () => {
      if (!isCurrentTask()) return;
      setPlayerState('正在播放', 'playing');
      if (window.MovieSyncPlayback && window.MovieSyncPlayback.onOnlinePlaybackStarted) window.MovieSyncPlayback.onOnlinePlaybackStarted();
    };
    playerTitle.textContent = title || itemName || '在线点播';
    playerPath.textContent = '在线点播 · ' + (itemName || '已选择播放项');
    playerStatus.textContent = '正在尝试播放在线线路；线路尚未经过预先验证。';
    setPlayerState('加载中', 'loading');
    const isHls = /\.m3u8(?:$|[?#])/i.test(parsed.href);
    if (isHls && !player.canPlayType('application/vnd.apple.mpegurl')) {
      await ensureHls();
      if (!isCurrentTask()) return false;
      if (!window.Hls.isSupported()) throw new Error('当前浏览器不支持 HLS 播放，可切换其他线路。');
      const hls = new window.Hls();
      onlineHls = hls;
      hls.loadSource(parsed.href);
      hls.attachMedia(player);
      hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
        if (!isCurrentTask() || onlineHls !== hls) return;
        player.play().catch(() => {
          if (isCurrentTask()) playerStatus.textContent = '线路已载入，请点击主播放器上的播放按钮。';
        });
      });
      hls.on(window.Hls.Events.ERROR, (_event, data) => {
        if (data && data.fatal && onlineHls === hls) handleFailure('HLS 线路播放失败');
      });
      return true;
    }
    if (!isCurrentTask()) return false;
    player.src = parsed.href;
    player.load();
    try {
      await player.play();
      if (!isCurrentTask()) return false;
      playerStatus.textContent = '正在播放在线线路。';
    } catch {
      if (!isCurrentTask()) return false;
      playerStatus.textContent = '线路已载入，请点击主播放器上的播放按钮；若仍失败，可切换线路。';
    }
    return true;
  }

  window.MovieSyncPlayback = window.MovieSyncPlayback || {};
  window.MovieSyncPlayback.playOnline = playOnline;
  window.MovieSyncPlayback.stopOnlinePlayback = stopOnlinePlayback;
  function stopPlaybackForSourceSwitch() {
    if (window.MovieSyncPlayback.cancelAutoPlayback) window.MovieSyncPlayback.cancelAutoPlayback();
    stopOnlinePlayback();
    clearSubtitleTracks();
    playerTitle.textContent = '选择一个视频开始播放';
    playerPath.textContent = '尚未选择文件';
    playerStatus.textContent = '已切换播放来源，选择资源后开始播放。';
    setPlayerState('已停止');

  }
  function activatePlaybackSource(source, stopCurrent = true) {
    const online = source === 'online';
    if (stopCurrent) stopPlaybackForSourceSwitch();
    const browser = document.getElementById('file-browser-panel');
    const panel = document.getElementById('vod_source_manager-inline-panel');
    const grid = document.getElementById('playback-main-grid');
    if (browser) browser.classList.toggle('hidden', online);
    if (panel) panel.classList.toggle('hidden', !online);
    const episodePanel = document.getElementById('vod_source_manager-episode-panel');
    if (episodePanel) episodePanel.classList.toggle('hidden', !online || !episodePanel.childElementCount);
    const openlistHint = document.getElementById('playback-openlist-hint');
    if (openlistHint) openlistHint.classList.toggle('hidden', online);
    document.querySelectorAll('[data-source-description]').forEach(description => {
      description.classList.toggle('hidden', description.dataset.sourceDescription !== source);
    });
    if (online) {
      playerTitle.textContent = '在线点播播放器';
      playerPath.textContent = '等待选择在线资源';
      playerStatus.textContent = '在在线点播面板搜索影片并选择线路播放。';
    } else {
      playerTitle.textContent = '选择一个视频开始播放';
      playerPath.textContent = '尚未选择文件';
      playerStatus.textContent = '播放地址由播放卡片解析，视频流由浏览器直接请求。';
    }
    if (grid) {
      grid.style.gridTemplateColumns = '';
      grid.classList.toggle('playback-online-layout', online);
    }
    document.querySelectorAll('[data-playback-source]').forEach(tab => {
      const active = tab.dataset.playbackSource === source;
      tab.setAttribute('aria-selected', String(active));
      tab.className = active
        ? 'rounded-xl border border-emerald-600/60 bg-emerald-950/50 px-4 py-2.5 text-xs font-semibold text-emerald-200 transition hover:bg-emerald-900/50'
        : 'rounded-xl border border-slate-700 bg-slate-900/50 px-4 py-2.5 text-xs font-semibold text-slate-300 transition hover:border-slate-600 hover:bg-slate-800';
    });
  }
  window.MovieSyncPlayback.activateOnline = () => activatePlaybackSource('online', false);
  window.MovieSyncPlayback.showFiles = () => activatePlaybackSource('files', true);
  document.querySelectorAll('[data-playback-source]').forEach(button => {
    button.addEventListener('click', () => {
      if (button.dataset.playbackSource === 'online') {
        activatePlaybackSource('online', true);
        if (window.MovieSyncPlayback.openOnline) window.MovieSyncPlayback.openOnline();
      } else if (window.MovieSyncPlayback.showFiles) window.MovieSyncPlayback.showFiles();
    });
  });

  function setSubtitleTracks(subtitles) {
    clearSubtitleTracks();
    if (!Array.isArray(subtitles)) return;

    for (const item of subtitles) {
      if (!item || typeof item.src !== 'string') continue;
      let subtitleUrl;
      try {
        subtitleUrl = new URL(item.src, window.location.href);
      } catch {
        continue;
      }
      if (!['http:', 'https:'].includes(subtitleUrl.protocol)) continue;

      const track = document.createElement('track');
      track.dataset.moviesyncTrack = 'true';
      track.kind = item.kind === 'captions' ? 'captions' : 'subtitles';
      track.label = String(item.label || item.srclang || '字幕');
      track.srclang = String(item.srclang || 'und');
      track.src = subtitleUrl.href;
      track.default = item.default === true;
      player.appendChild(track);
    }
  }
  const playerTitle = document.getElementById('player-title');
  const playerPath = document.getElementById('player-path');
  const playerStatus = document.getElementById('player-status');
  const playerState = document.getElementById('player-state');
  const providerBadge = document.getElementById('provider-badge');
  const history = [];
  let onlineHls = null;
  let playbackTaskGeneration = 0;
  let directoryRequestGeneration = 0;
  let currentPath = '';
  let currentItems = [];
  let selectedPath = '';

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  }
  function formatSize(bytes) {
    if (!Number.isFinite(bytes) || bytes < 0) return '';
    if (bytes < 1024) return bytes + ' B';
    const units = ['KB','MB','GB','TB'];
    let value = bytes / 1024, index = 0;
    while (value >= 1024 && index < units.length - 1) { value /= 1024; index++; }
    return value.toFixed(1) + ' ' + units[index];
  }
  function renderItems() {
    const query = searchInput.value.trim().toLocaleLowerCase();
    const items = currentItems.filter(item => String(item.name || '').toLocaleLowerCase().includes(query));
    list.replaceChildren();
    fileCount.textContent = items.length + ' / ' + currentItems.length + ' 项';
    if (!items.length) {
      list.innerHTML = '<div class="m-2 rounded-xl border border-dashed border-slate-800 p-7 text-center"><i class="fa-solid fa-folder-open mb-3 text-xl text-slate-600"></i><p class="text-xs text-slate-400">' + (currentItems.length ? '没有匹配的文件' : '这个目录里暂时没有文件') + '</p></div>';
      return;
    }
    for (const item of items) {
      const button = document.createElement('button');
      button.type = 'button';
      const row = document.createElement('div');
      row.className = 'flex items-center gap-1';
      button.className = 'media-row flex min-w-0 flex-1 items-center gap-3 rounded-xl px-3 py-3 text-left' + (item.path === selectedPath ? ' selected' : '');
      const icon = item.is_dir ? 'fa-folder text-amber-300' : (item.is_video ? 'fa-circle-play text-emerald-300' : 'fa-file text-slate-500');
      const size = typeof item.size === 'number' && !item.is_dir ? formatSize(item.size) : '';
      button.innerHTML = '<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-slate-950/80"><i class="fa-solid ' + icon + '"></i></span><span class="min-w-0 flex-1"><span class="block break-words text-xs font-medium leading-5 text-slate-200">' + escapeHtml(item.name) + '</span><span class="mt-0.5 block text-[10px] text-slate-500">' + (item.is_dir ? '文件夹' : (item.is_video ? '视频文件' : '其他文件')) + (size ? ' · ' + escapeHtml(size) : '') + '</span></span>' + (item.is_dir ? '<i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>' : (item.is_video ? '<i class="fa-solid fa-play text-[10px] text-emerald-400"></i>' : ''));
      button.disabled = !item.is_dir && !item.is_video;
      button.classList.toggle('cursor-not-allowed', button.disabled);
      button.addEventListener('click', () => {
        if (item.is_dir) loadDirectory(item.path, true);
        else if (item.is_video) playFile(item);
      });
      row.appendChild(button);
      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'shrink-0 rounded-lg border border-rose-900/70 px-3 py-2 text-xs text-rose-300 transition hover:border-rose-700 hover:bg-rose-950/50 disabled:cursor-wait disabled:opacity-50';
      deleteButton.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
      deleteButton.title = item.is_dir ? '删除此文件夹及其全部内容' : '通过 OpenList 删除此文件';
      deleteButton.setAttribute('aria-label', '删除 ' + item.name);
      deleteButton.addEventListener('click', async event => {
        event.preventDefault();
        event.stopPropagation();
        await deleteItem(item, deleteButton);
      });
      row.appendChild(deleteButton);
      list.appendChild(row);
    }
  }
  async function deleteItem(item, button) {
    const itemType = item.is_dir ? '文件夹及其中的全部内容' : '文件';
    const confirmed = window.confirm(
      '确定要通过 OpenList 删除这个' + itemType + '吗？\n\n' + item.path +
      (item.is_dir
        ? '\n\n此操作会递归删除文件夹内的所有内容，无法由 MovieSync 撤销。'
        : '\n\n这会删除映射存储中的实际文件，无法由 MovieSync 撤销。')
    );
    if (!confirmed) return;

    button.disabled = true;
    status.textContent = '正在删除' + (item.is_dir ? '文件夹：' : '：') + item.name;
    status.className = 'text-[11px] text-amber-300';
    try {
      const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
      const response = await fetch('/api/playback/remove', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken},
        body: JSON.stringify({path: item.path, is_dir: Boolean(item.is_dir), confirmed: true}),
        cache: 'no-store'
      });
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.message || '删除失败');
      status.textContent = '已删除：' + item.name;
      status.className = 'text-[11px] text-emerald-300';
      const refreshed = await loadDirectory(currentPath, false, true);
      status.textContent = refreshed
        ? '已删除：' + item.name
        : '项目已删除，但目录刷新失败；请点击“刷新目录”重试。';
      status.className = refreshed ? 'text-[11px] text-emerald-300' : 'text-[11px] text-amber-300';
    } catch (error) {
      status.textContent = error.message || '删除失败，请稍后重试';
      status.className = 'text-[11px] text-rose-300';
      button.disabled = false;
    }
  }
  async function loadDirectory(path = currentPath, pushHistory = false, forceRefresh = false) {
    const requestGeneration = ++directoryRequestGeneration;
    const isLatestRequest = () => requestGeneration === directoryRequestGeneration;
    status.textContent = forceRefresh ? '正在刷新目录…' : '正在读取目录…';
    refreshButton.disabled = true;
    refreshButton.classList.add('opacity-60', 'cursor-wait');
    const refreshIcon = refreshButton.querySelector('i');
    if (refreshIcon) refreshIcon.classList.add('fa-spin');
    status.className = 'text-[11px] text-slate-400';
    list.innerHTML = '<div class="p-8 text-center text-xs text-slate-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>正在读取文件列表…</div>';
    try {
      const params = new URLSearchParams();
      if (path) params.set('path', path);
      if (forceRefresh) params.set('_refresh', String(Date.now()));
      const query = params.toString() ? '?' + params.toString() : '';
      const response = await fetch('/api/playback/files' + query, {credentials:'same-origin', cache:'no-store'});
      const result = await response.json();
      if (!isLatestRequest()) return false;
      if (!response.ok || !result.success) throw new Error(result.message || '读取目录失败');
      if (pushHistory) history.push(currentPath);
      currentPath = path;
      currentItems = Array.isArray(result.items) ? result.items : [];
      pathLabel.textContent = path || '媒体根目录';
      backButton.disabled = history.length === 0;
      status.textContent = '目录读取成功';
      status.className = 'text-[11px] text-emerald-300';
      if (providerBadge) providerBadge.innerHTML = '<i class="fa-solid fa-circle text-[7px] text-emerald-400"></i>播放卡片已连接';
      renderItems();
      return true;
    } catch (error) {
      if (!isLatestRequest()) return false;
      status.textContent = error.message || '读取目录失败';
      status.className = 'text-[11px] text-rose-300';
      fileCount.textContent = '';
      list.innerHTML = '<div class="m-2 rounded-xl border border-dashed border-rose-900/70 p-5 text-center"><i class="fa-solid fa-triangle-exclamation mb-2 text-rose-300"></i><p class="text-xs leading-5 text-rose-200">' + escapeHtml(status.textContent) + '</p><p class="mt-2 text-[10px] leading-5 text-slate-500">请在卡片管理中安装并启用 OpenList 播放卡片，填写服务地址、Token 和媒体根目录。</p></div>';
      pathLabel.textContent = path || '媒体根目录';
      return false;
    } finally {
      if (isLatestRequest()) {
        refreshButton.disabled = false;
        refreshButton.classList.remove('opacity-60', 'cursor-wait');
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
      }
    }
  }
  async function playFile(item) {
    stopOnlinePlayback();
    const playbackTask = playbackTaskGeneration;
    selectedPath = item.path;
    renderItems();
    playerStatus.textContent = '正在获取播放地址…';
    playerTitle.textContent = item.name;
    playerPath.textContent = item.path;
    playerState.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1 text-[7px]"></i>加载中';
    playerState.className = 'shrink-0 rounded-full border border-amber-400/20 bg-amber-400/5 px-2.5 py-1.5 text-[10px] text-amber-300';
    try {
      const response = await fetch('/api/playback/resolve?path=' + encodeURIComponent(item.path), {credentials:'same-origin'});
      const result = await response.json();
      if (playbackTask !== playbackTaskGeneration) return;
      if (!response.ok || !result.success) throw new Error(result.message || '获取播放地址失败');
      clearSubtitleTracks();
      setSubtitleTracks(result.subtitles);
      player.src = result.url;
      player.load();
      player.play().catch(() => {});
      playerStatus.textContent = '播放地址已获取，正在尝试开始播放。';
    } catch (error) {
      if (playbackTask !== playbackTaskGeneration) return;
      playerStatus.textContent = error.message || '获取播放地址失败';
      playerState.textContent = '获取失败';
      playerState.className = 'shrink-0 rounded-full border border-rose-400/20 bg-rose-400/5 px-2.5 py-1.5 text-[10px] text-rose-300';
    }
  }
  backButton.addEventListener('click', async () => {
    if (!history.length || backButton.disabled) return;
    const targetPath = history[history.length - 1];
    const loaded = await loadDirectory(targetPath);
    if (loaded && history[history.length - 1] === targetPath) history.pop();
    backButton.disabled = history.length === 0;
  });
  refreshButton.addEventListener('click', () => loadDirectory(currentPath, false, true));
  searchInput.addEventListener('input', renderItems);
  document.getElementById('stop-btn').addEventListener('click', () => {
    stopOnlinePlayback();
    if (window.MovieSyncPlayback && window.MovieSyncPlayback.cancelAutoPlayback) {
      window.MovieSyncPlayback.cancelAutoPlayback();
    }
    clearSubtitleTracks();
    playerState.textContent = '已停止';
    playerState.className = 'shrink-0 rounded-full border border-slate-700 bg-slate-950/70 px-2.5 py-1.5 text-[10px] text-slate-500';
    playerStatus.textContent = '播放已停止。';
  });
  player.addEventListener('playing', () => {
    playerState.innerHTML = '<i class="fa-solid fa-circle mr-1 text-[7px] text-emerald-400"></i>播放中';
    playerState.className = 'shrink-0 rounded-full border border-emerald-400/20 bg-emerald-400/5 px-2.5 py-1.5 text-[10px] text-emerald-300';
    playerStatus.textContent = '正在播放。';
  });
  player.addEventListener('pause', () => {
    if (player.currentSrc && !player.ended) {
      playerState.textContent = '已暂停';
      playerState.className = 'shrink-0 rounded-full border border-slate-700 bg-slate-950/70 px-2.5 py-1.5 text-[10px] text-slate-400';
    }
  });
  player.addEventListener('loadedmetadata', () => {
    if (providerBadge) providerBadge.innerHTML = '<i class="fa-solid fa-circle text-[7px] text-emerald-400"></i>播放卡片已就绪';
  });
  player.addEventListener('error', () => {
    if (!player.currentSrc) return;
    playerState.textContent = '播放失败';
    playerState.className = 'shrink-0 rounded-full border border-rose-400/20 bg-rose-400/5 px-2.5 py-1.5 text-[10px] text-rose-300';
    playerStatus.textContent = '浏览器无法播放此视频。可能是播放链接不可达、格式不受支持，或上游不支持 Range 请求。';
  });
  loadDirectory('');

  // Run query-driven activation only after every player variable and event handler is initialized.
  // Calling activatePlaybackSource earlier invokes stopPlaybackForSourceSwitch(), which reads
  // const bindings declared later in this script and aborts the entire initializer (TDZ).
  const playbackQuery = new URLSearchParams(window.location.search);
  if (playbackQuery.get('title')) {
    activatePlaybackSource('online', true);
    if (window.MovieSyncPlayback && window.MovieSyncPlayback.openOnline) {
      window.MovieSyncPlayback.openOnline(playbackQuery.get('title'), playbackQuery.get('year') || '', playbackQuery.get('type') || 'movie');
    }
  }
})();
</script>
</body>
