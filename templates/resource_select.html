<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>选择资源 - MovieSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body class="min-h-screen">
<header class="glass-nav sticky top-0 z-40 border-b border-slate-800/70 backdrop-blur-xl">
    <div class="mx-auto flex max-w-screen-2xl items-center justify-between gap-3 px-4 py-3">
        <div class="flex min-w-0 items-center gap-3">
            <a href="/" class="glass-control rounded-xl px-3 py-2 text-xs text-slate-300 hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i>返回</a>
            <div class="min-w-0">
                <div class="text-[10px] uppercase tracking-widest text-blue-400">选择资源</div>
                <h1 id="page-title" class="truncate text-sm font-semibold text-white">选择要保存的资源</h1>
            </div>
        </div>
        <a href="/tasks" class="glass-control shrink-0 rounded-xl px-3 py-2 text-xs text-slate-300 hover:text-white"><i class="fa-solid fa-list-check mr-1"></i>任务中心</a>
    </div>
</header>

<main class="mx-auto w-full max-w-screen-2xl p-4 sm:p-6">
    <section class="glass-panel mb-5 overflow-hidden rounded-2xl p-4 sm:p-5">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
            <img id="movie-cover" class="h-32 w-24 shrink-0 rounded-xl object-cover bg-slate-950" alt="">
            <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                    <h2 id="movie-title" class="text-xl font-semibold text-white">加载中…</h2>
                    <span id="movie-tag" class="rounded-lg border border-blue-500/20 bg-blue-500/10 px-2 py-1 text-[10px] text-blue-300"></span>
                    <span id="movie-rate" class="rounded-lg border border-amber-500/20 bg-amber-500/10 px-2 py-1 text-[10px] text-amber-300"></span>
                </div>
                <p class="mt-2 text-xs leading-5 text-slate-500">先选择资源版本，再勾选要保存的文件。默认不会勾选任何文件。</p>
                <a id="movie-douban" href="#" target="_blank" rel="noopener noreferrer" class="douban-detail-btn mt-3 inline-flex items-center gap-2 rounded-xl px-3 py-2 text-[11px] font-medium"><i class="fa-solid fa-arrow-up-right-from-square"></i>打开豆瓣详情</a>
            </div>
            <div class="w-full shrink-0 sm:w-80 space-y-2">
                <div>
                    <label class="mb-1 block text-[10px] font-medium text-slate-500">保存位置</label>
                    <select id="storage-target" class="glass-control w-full rounded-xl px-3 py-2.5 text-xs text-slate-200"></select>
                </div>
                <div>
                    <label class="mb-1 block text-[10px] font-medium text-slate-500">保存目录</label>
                    <select id="target-fid" class="glass-control w-full rounded-xl px-3 py-2.5 text-xs text-slate-200"></select>
                </div>
            </div>
        </div>
    </section>

    <div id="loading" class="py-20 text-center text-slate-400">
        <i class="fa-solid fa-spinner fa-spin mb-3 text-3xl text-blue-500"></i>
        <p class="text-sm">正在查找可用资源…</p>
    </div>
    <div id="error-state" class="hidden rounded-2xl border border-rose-900/50 bg-rose-950/20 p-6 text-center text-sm text-rose-300"></div>
    <section id="resource-area" class="hidden">
        <div class="mb-4 flex items-end justify-between gap-3">
            <div>
                <div class="text-xs font-semibold text-slate-200">找到的资源版本</div>
                <div id="resource-summary" class="mt-1 text-[11px] text-slate-500"></div>
            </div>
        </div>
        <div id="candidate-filters" class="mb-4 flex flex-wrap gap-2 hidden" aria-label="按已识别集数筛选资源">
            <button type="button" data-candidate-filter="all" onclick="setCandidateFilter('all')" class="rounded-lg border border-blue-500 px-3 py-2 text-[11px] text-blue-300">全部资源</button>
            <button type="button" data-candidate-filter="multi" onclick="setCandidateFilter('multi')" class="rounded-lg border border-slate-700 px-3 py-2 text-[11px] text-slate-400">多集资源（≥3集）</button>
            <button type="button" data-candidate-filter="few" onclick="setCandidateFilter('few')" class="rounded-lg border border-slate-700 px-3 py-2 text-[11px] text-slate-400">少量 / 未识别（0–2集）</button>
        </div>
        <div id="resource-list" class="grid gap-4 xl:grid-cols-2"></div>
        <div class="mt-6 flex justify-center">
            <button id="more-resources" type="button" onclick="queryMoreCandidates()" class="hidden rounded-xl border border-slate-700 bg-slate-900/70 px-5 py-3 text-xs font-semibold text-slate-200 transition hover:border-blue-500 hover:text-white disabled:cursor-wait disabled:opacity-60">
                <i class="fa-solid fa-magnifying-glass-plus mr-2"></i>查询更多资源
            </button>
        </div>
    </section>
</main>
<div id="toast-container" class="fixed right-3 top-20 z-[200] flex w-[min(360px,calc(100vw-24px))] flex-col gap-2"></div>
<script src="{{ url_for('static', filename='js/resource-select.js') }}"></script>
</body>
</html>
