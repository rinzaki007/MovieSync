<!-- MovieSync 主页面
     用途：浏览和搜索影视、查找可用资源、选择文件并转存，也可以管理自动追剧任务。
     维护说明：页面负责显示内容；登录、影视信息、资源搜索和转存由后台服务处理。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>MovieSync - 影视搜索与转存</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20261012-mobile-v3">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶栏：左侧分类/功能，中间搜索框，右侧系统状态与设置（吸顶 + 毛玻璃） -->
    <header class="glass-nav backdrop-blur-xl border-b border-slate-800/70 sticky top-0 z-40 px-3 sm:px-4 py-2.5">
        <div class="max-w-screen-2xl mx-auto flex flex-wrap lg:flex-nowrap items-center justify-between gap-2 sm:gap-4">
            
            <!-- 左侧：分类与功能入口 -->
            <div class="flex items-center space-x-1.5 shrink-0 overflow-x-auto max-w-full">
                <button onclick="changeTag('电影')" class="nav-tag px-3.5 py-1.5 rounded-xl text-sm font-medium transition" data-tag="电影">电影</button>
                <button onclick="changeTag('电视剧')" class="nav-tag px-3.5 py-1.5 rounded-xl text-sm font-medium transition" data-tag="电视剧">电视剧</button>
                <button onclick="changeTag('综艺')" class="nav-tag px-3.5 py-1.5 rounded-xl text-sm font-medium transition" data-tag="综艺">综艺</button>
                <button onclick="changeTag('动漫')" class="nav-tag px-3.5 py-1.5 rounded-xl text-sm font-medium transition" data-tag="动漫">动漫</button>
                
                <a href="/tasks" class="px-2.5 py-1.5 rounded text-xs font-medium bg-purple-600/90 hover:bg-purple-500 text-white transition flex items-center gap-1 shadow-lg shadow-purple-600/10">
                    <i class="fa-solid fa-list-check"></i> 任务中心
                </a>
                <a href="/playback" class="px-2.5 py-1.5 rounded text-xs font-medium bg-emerald-600/90 hover:bg-emerald-500 text-white transition flex items-center gap-1 shadow-lg shadow-emerald-600/10">
                    <i class="fa-solid fa-circle-play"></i> 播放中心
                </a>
            </div>

            <!-- 中间：搜索框 -->
            <div class="order-last lg:order-none w-full lg:flex-1 lg:max-w-xl lg:mx-2 relative">
                <select id="metadata-provider-select" aria-label="影视信息来源" onchange="onMetadataProviderChange()"
                        class="absolute left-1.5 top-1.5 z-10 max-w-28 rounded-lg border border-slate-700/70 bg-slate-900 px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-blue-500">
                    <option value="">自动选择来源</option>
                </select>
                <input type="text" id="search-input" placeholder="输入影视名称，搜索影片或资源…" 
                       class="w-full glass-control bg-slate-950/55 border border-slate-700/60 rounded-xl pl-28 pr-10 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 shadow-inner"
                       onkeydown="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()" class="absolute right-3 top-2 text-slate-400 hover:text-white text-xs">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <!-- 右侧：设置 -->
            <div class="flex items-center space-x-2 shrink-0">
                <a href="/admin" class="px-2.5 py-1.5 text-xs glass-control bg-slate-900/55 hover:bg-slate-800/80 text-slate-300 rounded-xl border border-slate-700/60 flex items-center gap-1">
                    <i class="fa-solid fa-gear"></i> 设置
                </a>
            </div>
        </div>
    </header>

    <!-- 第二行：排序 -->
    <div class="glass-subnav backdrop-blur-xl border-b border-slate-800/60 px-4 py-2.5 sticky top-[57px] z-30 shadow-md">
        <div class="max-w-screen-2xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-2 overflow-hidden">
                <span class="text-xs text-slate-400 shrink-0">排序：</span>
                <div class="inline-flex glass-control p-1 rounded-xl border border-slate-700/60 text-xs gap-1">
                    <button onclick="changeSort('U')" class="sort-tag px-3 py-1.5 rounded-lg font-medium transition bg-blue-600/90 text-white shadow" data-sort="U"><i class="fa-solid fa-fire mr-1 text-amber-300"></i>热门</button>
                    <button onclick="changeSort('R')" class="sort-tag px-3 py-1.5 rounded-lg font-medium transition text-slate-400 hover:text-white" data-sort="R"><i class="fa-solid fa-clock mr-1 text-sky-300"></i>最新</button>
                </div>
                <span class="hidden sm:inline text-[11px] text-slate-500 ml-2">点击海报可查看详情、搜索资源或添加追剧任务</span>
            </div>
        </div>
    </div>

    <!-- 主展示网格 -->
    <main class="flex-1 max-w-screen-2xl w-full mx-auto p-3 sm:p-4">
        <div id="loading" class="text-center py-20 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-500"></i>
            <p class="text-sm">正在加载影视信息…</p>
        </div>
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 2xl:grid-cols-8 gap-3 sm:gap-4 hidden"></div>
        <div id="empty-state" class="hidden min-h-[45vh] flex items-center justify-center">
            <div class="text-center max-w-sm">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-900 border border-slate-800 text-slate-500">
                    <i class="fa-solid fa-film text-xl"></i>
                </div>
                <h2 class="text-sm font-semibold text-slate-200">没有找到相关影视</h2>
                <p class="mt-2 text-xs leading-6 text-slate-500">试试更换关键词，或切换“热门推荐 / 最近更新”后再找找。</p>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed right-3 top-20 z-[200] flex w-[min(360px,calc(100vw-24px))] flex-col gap-2 pointer-events-none"></div>

    <!-- 影视详情操作抽屉：海报点击后的统一入口 -->
    <div id="movie-detail-drawer" class="fixed inset-0 z-[90] hidden">
        <div onclick="closeMovieDetail()" class="absolute inset-0 bg-black/65 backdrop-blur-sm"></div>
        <aside class="absolute right-0 top-0 h-full w-full max-w-xl overflow-y-auto border-l border-slate-700/60 bg-slate-900/75 backdrop-blur-2xl shadow-2xl">
            <div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-700/60 bg-slate-900/70 px-5 py-4 backdrop-blur">
                <div>
                    <div class="text-[10px] font-medium uppercase tracking-widest text-blue-400">影视操作</div>
                    <h2 id="movie-detail-title" class="mt-1 text-base font-semibold text-white">影视详情</h2>
                </div>
                <button onclick="closeMovieDetail()" class="rounded-md px-2 py-1 text-slate-400 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-5 p-5">
                <div class="flex gap-4 glass-card rounded-2xl p-4">
                    <img id="movie-detail-cover" class="h-40 w-28 shrink-0 rounded-xl object-cover bg-slate-900" alt="">
                    <div class="min-w-0">
                        <h3 id="movie-detail-name" class="text-lg font-semibold text-white"></h3>
                        <div id="movie-detail-meta" class="mt-2 text-xs leading-6 text-slate-400"></div>
                        <p id="movie-detail-summary" class="mt-3 max-h-28 overflow-y-auto text-[11px] leading-5 text-slate-500"></p>
                        <div id="movie-detail-genres" class="mt-2 flex flex-wrap gap-1.5"></div>
                        <a id="movie-detail-douban" href="#" target="_blank" rel="noopener noreferrer" class="douban-detail-btn mt-3 inline-flex items-center gap-2 rounded-xl px-3.5 py-2 text-[11px] font-medium">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> 在豆瓣打开
                        </a>
                    </div>
                </div>
                <div>
                    <div class="mb-2 text-xs font-semibold text-slate-300">接下来要做什么？</div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <button onclick="movieDetailTransfer()" class="group rounded-2xl border border-emerald-800/70 bg-emerald-950/30 p-4 text-left hover:border-emerald-600 hover:bg-emerald-950/50">
                            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-600/20 text-emerald-400"><i class="fa-solid fa-cloud-arrow-down"></i></div>
                            <div class="mt-3 text-sm font-semibold text-white">转存资源</div>
                            <div class="mt-1 text-[11px] leading-5 text-slate-400">从已启用的资源来源中查找资源，选好版本和文件后保存到指定位置。</div>
                        </button>
                        <button onclick="movieDetailWatch()" class="group rounded-2xl border border-sky-800/70 bg-sky-950/30 p-4 text-left hover:border-sky-600 hover:bg-sky-950/50">
                            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-sky-600/20 text-sky-300"><i class="fa-solid fa-circle-play"></i></div>
                            <div class="mt-3 text-sm font-semibold text-white">立即观看</div>
                            <div class="mt-1 text-[11px] leading-5 text-slate-400">从已启用的影视采集源查找影片并直接播放，不影响转存和追剧。</div>
                        </button>
                        <button onclick="movieDetailChase()" class="group rounded-2xl border border-purple-800/70 bg-purple-950/30 p-4 text-left hover:border-purple-600 hover:bg-purple-950/50">
                            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-purple-600/20 text-purple-400"><i class="fa-solid fa-rotate"></i></div>
                            <div class="mt-3 text-sm font-semibold text-white">添加追剧</div>
                            <div class="mt-1 text-[11px] leading-5 text-slate-400">系统会定期检查选定的资源来源；发现新集后，会自动保存到指定位置。</div>
                        </button>
                        <button onclick="movieDetailMoreLinks()" class="group rounded-2xl border border-amber-800/70 bg-amber-950/20 p-4 text-left hover:border-amber-600 hover:bg-amber-950/40">
                            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-600/20 text-amber-300"><i class="fa-solid fa-link"></i></div>
                            <div class="mt-3 text-sm font-semibold text-white">更多下载链接</div>
                            <div class="mt-1 text-[11px] leading-5 text-slate-400">查看其他网盘分享、磁力和 ED2K 链接，支持去重与复制。</div>
                        </button>
                    </div>
                </div>
                <div class="rounded-xl border border-slate-800 bg-slate-950/70 p-4">
                    <div class="flex items-center gap-2 text-xs font-medium text-slate-300"><i class="fa-solid fa-circle-info text-blue-400"></i> 说明</div>
                    <p class="mt-2 text-[11px] leading-5 text-slate-500">手动转存和自动追剧都会显示在任务中心。任务会在后台继续运行，你可以随时离开这个页面。</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- 更多下载链接：仅展示与复制，不进入现有转存/播放流程 -->
    <div id="more-download-links-modal" class="fixed inset-0 z-[110] hidden items-center justify-center bg-black/70 p-3 backdrop-blur-sm">
        <div class="flex max-h-[90vh] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-slate-700/80 bg-slate-900/95 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 px-5 py-4">
                <div><div class="text-[10px] uppercase tracking-widest text-amber-300">PanSou</div><h3 id="more-links-title" class="mt-1 text-base font-semibold text-white">更多下载链接</h3></div>
                <button onclick="closeMoreDownloadLinks()" class="rounded-lg px-3 py-2 text-slate-400 hover:bg-slate-800 hover:text-white" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="more-links-content" class="space-y-3 overflow-y-auto p-4 sm:p-5"><div class="py-8 text-center text-sm text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>正在搜索更多资源…</div></div>
        </div>
    </div>

    <!-- 资源版本选择弹窗：电影按版本选择，剧集按资源包折叠集数 -->
    <div id="candidate-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center hidden">
        <div class="candidate-modal-shell bg-slate-900/95 border border-slate-700/80 rounded-2xl w-full max-w-6xl p-4 sm:p-6 shadow-2xl space-y-4 max-h-[92vh] flex flex-col backdrop-blur-xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-3">
                    <h3 class="text-base font-medium text-white flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 选择要保存的资源版本
                    </h3>
                </div>
                <button onclick="closeCandidateModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div class="target-folder-bar bg-slate-950/80 border border-slate-800 rounded-xl p-3 flex flex-col sm:flex-row sm:items-center gap-2.5">
                <label for="batch-storage-target" class="text-xs font-semibold text-sky-300 shrink-0"><i class="fa-solid fa-cloud-arrow-up"></i> 存储卡片：</label>
                <select id="batch-storage-target" class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500 sm:max-w-56">
                    <option value="">正在加载存储卡片…</option>
                </select>
                <label for="batch-target-fid" class="text-xs font-semibold text-amber-400 shrink-0"><i class="fa-solid fa-folder-tree"></i> 保存目录：</label>
                <select id="batch-target-fid" class="global-category-select flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                    <option value="">请先选择存储卡片</option>
                </select>
                <span class="text-[10px] text-slate-500 shrink-0">仅支持当前卡片声明兼容的分享类型</span>
            </div>

            <div id="candidate-content" class="flex-1 overflow-y-auto space-y-5 pr-1 sm:pr-2"></div>
            
            <div class="flex justify-end pt-2 border-t border-slate-800">
                <button onclick="closeCandidateModal()" class="px-4 py-2 text-xs bg-slate-800 text-slate-300 rounded hover:bg-slate-700">关闭</button>
            </div>
        </div>
    </div>

    <!-- 低调的页尾说明入口：不占用首页顶部空间，保留第三方署名与项目说明的访问方式。 -->
    <footer class="mt-auto px-4 py-3 text-center text-[10px] text-slate-500/50">
        <a href="/about" class="transition hover:text-slate-300">关于 MovieSync · 第三方数据来源与署名说明</a>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/maccms-playback.js') }}"></script>
</body>
</html>
