<!-- MovieSync 登录/初始化页面 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ '系统初始化' if is_setup else '系统登录' }} - MovieSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #020617;
            overflow: hidden;
        }
        .login-card {
            position: relative;
            width: min(430px, calc(100vw - 28px));
            padding: 34px;
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 24px;
            background: rgba(15,23,42,.48);
            backdrop-filter: blur(22px) saturate(130%);
            -webkit-backdrop-filter: blur(22px) saturate(130%);
            box-shadow: 0 30px 100px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.08);
        }
        .login-input {
            background: rgba(2,6,23,.46) !important;
            border-color: rgba(148,163,184,.22) !important;
            backdrop-filter: blur(10px);
        }
        .login-input:focus {
            border-color: rgba(96,165,250,.75) !important;
            box-shadow: 0 0 0 3px rgba(59,130,246,.12);
        }
        .login-logo {
            box-shadow: 0 0 35px rgba(59,130,246,.22);
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}?v=20261012-mobile-v3">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body class="flex items-center justify-center p-4">
    <main class="login-card">
        <div class="text-center space-y-2">
            <div class="login-logo inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/20 border border-blue-400/20 text-blue-300 text-xl mb-2">
                <i class="fa-solid fa-film"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">MovieSync</h1>
            <p class="text-xs text-slate-300/75">{{ '首次使用，请创建管理员账号' if is_setup else '登录后即可管理影视资源' }}</p>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)" class="mt-7 space-y-4">
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-200/90">账号</label>
                <input type="text" id="username" required placeholder="请输入管理员账号"
                       class="login-input w-full rounded-xl px-3.5 py-3 text-sm text-slate-100 focus:outline-none transition">
            </div>
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-200/90">密码</label>
                <input type="password" id="password" required placeholder="请输入密码"
                       class="login-input w-full rounded-xl px-3.5 py-3 text-sm text-slate-100 focus:outline-none transition">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600/90 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-blue-600/20">
                {{ '立即初始化并登录' if is_setup else '登 录' }}
            </button>
        </form>
        <div class="mt-5 text-center text-[10px] text-slate-400/60 tracking-wider">影视资源管理工具 · MovieSync</div>
    </main>
    <script>
        const isSetup = {{ 'true' if is_setup else 'false' }};
        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const endpoint = isSetup ? '/api/setup' : '/api/login';
            try {
                const resp = await fetch(endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username, password}) });
                const res = await resp.json();
                if (res.success) window.location.href = '/';
                else alert(res.message || '操作失败');
            } catch (err) { alert('请求发生异常'); }
        }
    </script>
</body>
</html>
